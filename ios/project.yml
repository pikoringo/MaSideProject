name: MaBestieWidget
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  MaBestieWidgetHost:
    type: application
    platform: iOS
    sources:
      - MaBestieWidgetHost/MaBestieWidgetHostApp.swift
    info:
      path: MaBestieWidgetHost/Info.plist
      properties:
        CFBundleDisplayName: MaBestie Widget
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mabestie.widgethost
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: MaBestieWidgetExtension
        embed: true
  MaBestieWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - MaBestieWidget/MaBestieWidget.swift
      - path: MaBestieWidget/Resources
        type: folder
    info:
      path: MaBestieWidget/Info.plist
      properties:
        CFBundleDisplayName: MaBestie Partner Status
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mabestie.widgethost.widget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
